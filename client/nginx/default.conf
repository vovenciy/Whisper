server {
    listen 8080 ssl;
    server_name whisper.volkov.dev;

    # Сертификаты Let's Encrypt (будут проброшены с сервера Ubuntu)
    ssl_certificate /etc/letsencrypt/live/whisper.volkov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whisper.volkov.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # редирект в контейнер
    location / {
        # 2. Заголовки для основных запросов (GET, POST, PUT, DELETE и т.д.)
        add_header 'Access-Control-Allow-Origin' 'https://whisper.volkov.dev' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://whisper.volkov.dev' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Кэшируем результат OPTIONS-запроса на 24 часа (браузер не будет слать его постоянно)
            add_header 'Access-Control-Max-Age' 86400;
            # Возвращаем пустой ответ со статусом 204 (No Content)
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://servercontainer:8080;

        # Обязательно переключаем Nginx на HTTP/1.1
        proxy_http_version 1.1;
        # Передаем заголовки для Upgrade соединения
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 10800s; # Держать соединение открытым до 1 часа бездействия
        proxy_send_timeout 10800s;
    }
}

