# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name whisper.volkov.dev ://whisper.volkov.dev;
    return 301 https://$host$request_uri;
}

# Основной HTTPS сервер
server {
    listen 443 ssl;
    server_name whisper.volkov.dev ://whisper.volkov.dev;

    # Сертификаты Let's Encrypt (будут проброшены с сервера Ubuntu)
    ssl_certificate /etc/letsencrypt/live/://whisper.volkov.dev;
    ssl_certificate_key /etc/letsencrypt/live/://whisper.volkov.dev;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Поддержка React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
